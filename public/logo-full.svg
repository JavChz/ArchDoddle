    <circle cx="256" cy="286" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="10" />
    <rect x="210" y="92" width="92" height="62" rx="16" fill="#38BDF8" stroke="#0F172A" stroke-width="10" />
    <rect x="86" y="347" width="92" height="62" rx="16" fill="#818CF8" stroke="#0F172A" stroke-width="10" />
    <rect x="334" y="347" width="92" height="62" rx="16" fill="#2DD4BF" stroke="#0F172A" stroke-width="10" />
  </g>

  <!-- Wordmark -->
  <text x="98" y="47" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8" fill="#0F172A">
