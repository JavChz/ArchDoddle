<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ArchDoddle Logo">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="skyNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="indigoNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="tealNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>

  <!-- Rounded squircle base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#archBg)" stroke="#334155" stroke-width="6" />

  <!-- Subtle blueprint reference lines -->
  <g stroke="#38BDF8" stroke-opacity="0.09" stroke-width="2">
    <line x1="128" y1="48" x2="128" y2="464" />
    <line x1="256" y1="48" x2="256" y2="464" />
    <line x1="384" y1="48" x2="384" y2="464" />
    <line x1="48" y1="160" x2="464" y2="160" />
    <line x1="48" y1="286" x2="464" y2="286" />
    <line x1="48" y1="378" x2="464" y2="378" />
  </g>

  <!-- Structural "A" graph beams -->
  <g fill="none" stroke="#F1F5F9" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M132 378 L256 122 L380 378" />
    <line x1="176.5" y1="286" x2="335.5" y2="286" />
  </g>

  <!-- Center hub junction on crossbar -->
  <circle cx="256" cy="286" r="21" fill="#0F172A" stroke="#38BDF8" stroke-width="8" />
  <circle cx="256" cy="286" r="6" fill="#F1F5F9" />

  <!-- Apex node (Primary Edge / Orchestrator) -->
  <rect x="210" y="92" width="92" height="62" rx="16" fill="url(#skyNode)" stroke="#0F172A" stroke-width="10" />
  <rect x="232" y="114" width="48" height="8" rx="4" fill="#E0F2FE" />
  <rect x="242" y="128" width="28" height="6" rx="3" fill="#BAE6FD" fill-opacity="0.85" />

  <!-- Bottom-left node (Compute Service) -->
  <rect x="86" y="347" width="92" height="62" rx="16" fill="url(#indigoNode)" stroke="#0F172A" stroke-width="10" />
  <rect x="108" y="369" width="48" height="8" rx="4" fill="#EEF2FF" />
  <rect x="118" y="383" width="28" height="6" rx="3" fill="#C7D2FE" fill-opacity="0.85" />

  <!-- Bottom-right node (Data / Storage) -->
  <rect x="334" y="347" width="92" height="62" rx="16" fill="url(#tealNode)" stroke="#0F172A" stroke-width="10" />
  <rect x="356" y="369" width="48" height="8" rx="4" fill="#CCFBF1" />
  <rect x="366" y="383" width="28" height="6" rx="3" fill="#99F6E4" fill-opacity="0.85" />
</svg>
